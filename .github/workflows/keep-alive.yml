
name: VacaBox Keep Alive

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Manter VacaBox ativo
        run: |
          curl --fail --silent --show-error \
          --max-time 30 \
          https://vacabox.onrender.com/api/ping
